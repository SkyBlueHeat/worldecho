# WorldEcho Türkçe mesajları. MiniMessage biçimlendirmesi desteklenir.
# Yer tutucular {ad} biçimindedir ve yerleştirilmeden önce temizlenir.

prefix: "<gray>[<aqua>WorldEcho</aqua>]</gray> "

no-permission: "<red>Bu komutu kullanma yetkiniz yok.</red>"
players-only: "<red>Bu alt komut yalnızca oyuncular tarafından kullanılabilir.</red>"
usage: "<white>Kullanım: /worldecho status | recent [adet] | inspect item | inspect entity | reload | eligibility profiles | eligibility check <entity|item> <anahtar> <profil> | eligibility all <entity|item> <anahtar></white>"
unknown-subcommand: "<red>Bilinmeyen alt komut. Yardım için /worldecho yazın.</red>"

status-header: "<aqua>Hafıza çekirdeği durumu</aqua>"
status-line: "<gray>{key}:</gray> <white>{value}</white>"
status-failed: "<red>Veritabanı durumu okunamadı. Sunucu günlüğüne bakın.</red>"

recent-loading: "<gray>En son {count} hatıra yükleniyor...</gray>"
recent-header: "<aqua>Son hatıralar</aqua>"
recent-empty: "<gray>Henüz hiçbir hatıra kaydedilmedi.</gray>"
recent-line: "<gray>{time}</gray> <white>{type}</white> <gray>fail=</gray><white>{actor}</white> <gray>eşya=</gray><white>{item}</white> <dark_gray>{id}</dark_gray>"
recent-failed: "<red>Son hatıralar okunamadı. Sunucu günlüğüne bakın.</red>"
recent-invalid-count: "<yellow>'{value}' bir sayı değil; {default} kullanılıyor.</yellow>"

inspect-usage: "<white>Kullanım: /worldecho inspect item | /worldecho inspect entity</white>"
inspect-header: "<aqua>İçerik kimliği</aqua>"
inspect-no-item: "<yellow>İncelemek için ana elinizde bir eşya tutun.</yellow>"
inspect-no-entity: "<yellow>İncelemek için 12 blok içindeki bir varlığa bakın.</yellow>"

reload-success: "<green>Yapılandırma, mesajlar ve bağlamalar yeniden yüklendi.</green>"
reload-warning: "<yellow>{warning}</yellow>"
reload-failed: "<red>Yeniden yükleme başarısız. Önceki yapılandırma etkin kalmaya devam ediyor.</red>"

eligibility-usage: "<white>Kullanım: /worldecho eligibility profiles | check <entity|item> <anahtar> <profil> | all <entity|item> <anahtar></white>"
eligibility-profiles-header: "<aqua>Uygunluk profilleri</aqua>"
eligibility-profile-line: "<white>{line}</white>"
eligibility-check-usage: "<white>Kullanım: /worldecho eligibility check <entity|item> <içerik-anahtarı> <profil></white>"
eligibility-all-usage: "<white>Kullanım: /worldecho eligibility all <entity|item> <içerik-anahtarı></white>"
eligibility-invalid-target: "<red>Hedef 'entity' veya 'item' olmalıdır.</red>"
eligibility-invalid-key: "<red>Geçersiz içerik anahtarı: {key}</red>"
eligibility-result-line: "<white>{line}</white>"
eligibility-all-header: "<aqua>{key} için uygunluk</aqua>"
eligibility-all-limit: "<yellow>Çıktı sınırına ulaşıldı ({limit} profil).</yellow>"
