# WorldEcho English messages. MiniMessage formatting is supported.
# Placeholders are written as {name} and are sanitized before substitution.

prefix: "<gray>[<aqua>WorldEcho</aqua>]</gray> "

no-permission: "<red>You do not have permission to use this command.</red>"
players-only: "<red>This subcommand can only be used by a player.</red>"
usage: "<white>Usage: /worldecho status | recent [count] | inspect item | inspect entity | reload | eligibility profiles | eligibility check <entity|item> <key> <profile> | eligibility all <entity|item> <key> | item track | item inspect | item owner <item-id> | item history <item-id> [count] | item assign-owner <item-id> player|entity|system <id></white>"
unknown-subcommand: "<red>Unknown subcommand. Use /worldecho for help.</red>"

status-header: "<aqua>Memory kernel status</aqua>"
status-line: "<gray>{key}:</gray> <white>{value}</white>"
status-failed: "<red>Database status could not be read. See the server log.</red>"

recent-loading: "<gray>Loading the {count} most recent memories...</gray>"
recent-header: "<aqua>Recent memories</aqua>"
recent-empty: "<gray>No memories have been recorded yet.</gray>"
recent-line: "<gray>{time}</gray> <white>{type}</white> <gray>actor=</gray><white>{actor}</white> <gray>item=</gray><white>{item}</white> <dark_gray>{id}</dark_gray>"
recent-failed: "<red>Recent memories could not be read. See the server log.</red>"
recent-invalid-count: "<yellow>'{value}' is not a number; using {default}.</yellow>"

inspect-usage: "<white>Usage: /worldecho inspect item | /worldecho inspect entity</white>"
inspect-header: "<aqua>Content identity</aqua>"
inspect-no-item: "<yellow>Hold an item in your main hand to inspect it.</yellow>"
inspect-no-entity: "<yellow>Look at an entity within 12 blocks to inspect it.</yellow>"

reload-success: "<green>Configuration, messages, and bindings reloaded.</green>"
reload-warning: "<yellow>{warning}</yellow>"
reload-failed: "<red>Reload failed. The previous configuration is still active.</red>"

eligibility-usage: "<white>Usage: /worldecho eligibility profiles | check <entity|item> <key> <profile> | all <entity|item> <key></white>"
eligibility-profiles-header: "<aqua>Eligibility profiles</aqua>"
eligibility-profile-line: "<white>{line}</white>"
eligibility-check-usage: "<white>Usage: /worldecho eligibility check <entity|item> <content-key> <profile></white>"
eligibility-all-usage: "<white>Usage: /worldecho eligibility all <entity|item> <content-key></white>"
eligibility-invalid-target: "<red>Target must be 'entity' or 'item'.</red>"
eligibility-invalid-key: "<red>Invalid content key: {key}</red>"
eligibility-result-line: "<white>{line}</white>"
eligibility-all-header: "<aqua>Eligibility for {key}</aqua>"
eligibility-all-limit: "<yellow>Output limit reached ({limit} profiles).</yellow>"

item-usage: "<white>Usage: /worldecho item track | inspect | owner <item-id> | history <item-id> [count] | assign-owner <item-id> player|entity|system <id> | reconcile [player] | policy</white>"
item-track-success: "<green>Item tracked with WorldEcho ID: {item-id}</green>"
item-already-tracked: "<yellow>Item is already tracked with WorldEcho ID: {item-id}</yellow>"
item-malformed-id: "<red>Item has a malformed WorldEcho ID in its metadata. Use /worldecho item repair to fix.</red>"
item-missing: "<yellow>Hold an item in your main hand to track it.</yellow>"
item-not-tracked: "<yellow>Item is not tracked by WorldEcho.</yellow>"
item-persistence-missing: "<yellow>PDC identity exists ({item-id}) but persistence record is missing. Run /worldecho item track to reconcile.</yellow>"
item-reconciliation-success: "<green>Persistence record created for existing WorldEcho ID: {item-id}</green>"
item-unsupported: "<red>This item type cannot be tracked.</red>"
item-track-failed: "<red>Failed to create tracked-item record. See the server log.</red>"
item-id-line: "<gray>item-id:</gray> <white>{item-id}</white>"
item-tracked-status: "<gray>tracked:</gray> <white>{status}</white>"
item-content-key: "<gray>content-key:</gray> <white>{key}</white>"
item-material: "<gray>material:</gray> <white>{material}</white>"
item-current-owner: "<gray>current-owner:</gray> <white>{owner}</white>"
item-no-owner: "<gray>current-owner:</gray> <white>-</white>"
item-ownership-sequence: "<gray>ownership-sequence:</gray> <white>{sequence}</white>"
item-history-count: "<gray>history-count:</gray> <white>{count}</white>"
item-identity-warning: "<yellow>Identity warning: {warning}</yellow>"
item-history-header: "<aqua>Ownership history for {item-id}</aqua>"
item-history-empty: "<gray>No ownership history recorded.</gray>"
item-history-entry: "<gray>#{sequence}</gray> <white>{previous}</white> <gray>→</gray> <white>{new}</white> <gray>reason=</gray><white>{reason}</white> <gray>at</gray> <white>{time}</white>"
item-owner-header: "<aqua>Current ownership for {item-id}</aqua>"
item-assign-success: "<green>WorldEcho ownership record updated. The physical Minecraft item was not moved.</green>"
item-assign-invalid-uuid: "<red>Invalid UUID: {value}</red>"
item-assign-invalid-subject: "<red>Invalid subject type: {value}. Use player, entity, or system.</red>"
item-assign-not-tracked: "<red>Item {item-id} is not tracked by WorldEcho.</red>"
item-assign-failed: "<red>Failed to update ownership record. See the server log.</red>"
item-console-requires-id: "<red>This subcommand requires an item ID when used from console.</red>"
item-player-held-required: "<red>This subcommand requires a player holding an item.</red>"
item-database-failed: "<red>Database operation failed. See the server log.</red>"
item-invalid-id: "<red>Invalid item ID: {value}</red>"
item-history-limit-clamped: "<yellow>Count {requested} exceeds maximum {maximum}; using {maximum}.</yellow>"
item-reconcile-usage: "<white>Usage: /worldecho item reconcile [player]</white>"
item-reconcile-started: "<gray>Reconciliation scheduled for {player}...</gray>"
item-reconcile-completed: "<green>Reconciliation completed for {player}.</green>"
item-player-not-found: "<red>Player not found: {player}</red>"
item-policy-header: "<aqua>Identity classification policy</aqua>"
item-policy-mode: "<gray>identity-mode:</gray> <white>{mode}</white>"
item-policy-existing: "<gray>existing-identity:</gray> <white>{existing}</white>"
item-policy-reasons: "<gray>classification-reasons:</gray> <white>{reasons}</white>"
item-policy-confidence: "<gray>confidence:</gray> <white>{confidence}</white>"
item-policy-lot-fingerprint: "<gray>lot-fingerprint:</gray> <white>{fingerprint}</white>"
item-policy-no-item: "<yellow>Hold an item in your main hand to inspect its policy.</yellow>"
item-policy-unique: "UNIQUE"
item-policy-lot: "LOT"
item-policy-yes: "yes"
item-policy-no: "no"
item-policy-none: "none"
item-track-diagnostic: "<gray>Manual track is a diagnostic and repair tool. Automatic tracking handles items without commands.</gray>"
item-malformed-identity: "<yellow>Malformed WorldEcho identity detected. Use /worldecho item track to repair. Skipping this item.</yellow>"
item-duplicate-identity: "<yellow>Duplicate WorldEcho identity {item-id} observed in multiple slots. Warning recorded.</yellow>"
item-persistence-failure: "<red>Persistence failed for item {item-id}. PDC identity preserved. Reconciliation will retry.</red>"
item-automatic-tracking-disabled: "<gray>Automatic item tracking is disabled.</gray>"
item-reconcile-console-usage: "<white>Console usage: /worldecho item reconcile <player></white>"
